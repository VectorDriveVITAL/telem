services:
  influxdb:
    image: influxdb:2.7
    container_name: telem-influxdb
    ports:
      - "8086:8086"
    environment:
      # DOCKER_INFLUXDB_INIT_MODE=setup makes the container run the
      # equivalent of `influx setup` on first boot, using these values -
      # no manual UI walkthrough needed. On later restarts, with the
      # volume already populated, this is a no-op.
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=telemetry123
      - DOCKER_INFLUXDB_INIT_ORG=telem
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=dev-super-secret-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  influxdb-data:
  influxdb-config:
