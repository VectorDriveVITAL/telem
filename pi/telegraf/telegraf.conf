# /etc/telegraf/telegraf.conf
# MQTT in, telem out. Telem writes InfluxDB itself, so it can register sensors, apply
# calibration, raise alerts and notice a silent buoy. Writing InfluxDB from here would skip all that.

[agent]
  interval = "10s"
  flush_interval = "5s"
  metric_batch_size = 100
  metric_buffer_limit = 10000   # readings kept while telem is down; the oldest go first when full
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["vital/buoy/+/readings", "vital/service/+/metrics"]
  qos = 1
  client_id = "telegraf-telem"
  persistent_session = true      # the broker keeps QoS 1 messages while Telegraf restarts
  username = "telegraf"
  password = "${MQTT_PASSWORD:?set MQTT_PASSWORD in /etc/default/telegraf}"
  max_reconnect_interval = "30s"
  # Leave topic_tag at its default ("topic"): telem reads the buoy or service from it.
  data_format = "json"
  json_time_key = "time"
  json_time_format = "2006-01-02T15:04:05Z07:00"

[[outputs.http]]
  url = "${TELEM_URL:-http://127.0.0.1:8000}/api/ingest/telegraf"
  method = "POST"
  data_format = "json"
  json_timestamp_units = "1ms"
  timeout = "10s"
  # Telem answers 200 and lists rejected readings, so a bad reading never blocks the batch.
  # These codes mean the request itself is wrong: drop it instead of retrying forever.
  non_retryable_statuscodes = [400, 404, 413, 422]
  [outputs.http.headers]
    Content-Type = "application/json"

# Optional raw archive of everything received, in a separate InfluxDB bucket:
# [[outputs.influxdb_v2]]
#   urls = ["http://127.0.0.1:8086"]
#   token = "${INFLUX_TOKEN}"
#   organization = "telem"
#   bucket = "mqtt_raw"
